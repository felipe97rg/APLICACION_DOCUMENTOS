version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: postgres_trazabilidad
    restart: always
    environment:
      POSTGRES_DB: trazabilidad_documentos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Cenyt123*
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
