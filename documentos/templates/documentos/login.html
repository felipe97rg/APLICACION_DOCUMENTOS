<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    {% load static %}

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'documentos/css/login.css' %}">
</head>
<body>

    <div class="container-fluid login-container">
        <!-- Sección izquierda con el logo -->
        <div class="login-left">
            <img src="{% static 'documentos/images/Logo_Cenyt.png' %}" alt="Logo Cenyt" class="logo-img">
        </div>

        <!-- Sección derecha con el formulario -->
        <div class="login-right">
            <div class="card p-4 shadow-lg login-card">
                <h3 class="text-center mb-4">Iniciar Sesión</h3>

                <!-- Mensajes de error -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger text-center p-2">{{ message }}</div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Usuario:</label>
                        <input type="text" name="username" class="form-control input-field" placeholder="Ingrese su usuario" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contraseña:</label>
                        <input type="password" name="password" class="form-control input-field" placeholder="Ingrese su contraseña" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 login-btn">Iniciar Sesión</button>
                </form>

                <p class="text-center mt-3">
                    <a href="#" class="text-decoration-none forgot-password">¿Olvidaste tu contraseña?</a>
                </p>
            </div>
        </div>
    </div>

</body>
</html>
