<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestión Documental{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'documentos/css/base.css' %}">
</head>

<body>
    <!-- Barra de navegación principal -->
    <header class="header shadow">
        <div class="header-container">

            <a href="{% url 'reporte' %}" class="logo">
                <img src="{% static 'documentos/images/Logo_Cenyt_Reducido.png' %}" alt="Logo" width="40" height="40" style="vertical-align: middle; margin-right: 10px;">
                Gestión Documental
            </a>
                        

            
            <nav class="navbar">
                <span class="user-info">Usuario: {{ user.username }}</span>
                <a href="{% url 'reporte' %}" class="nav-link {% if request.path == '/reporte/' %}active{% endif %}">Reporte</a>
                <a href="{% url 'dashboard' %}" class="nav-link {% if request.path == '/dashboard/' %}active{% endif %}">Documentos</a>
                <a href="{% url 'upload_proyecto' %}" class="nav-link {% if request.path == '/upload_proyecto/' %}active{% endif %}">Gestionar Proyectos</a>
                <a href="{% url 'logout' %}" class="nav-link">Cerrar Sesión</a>
            </nav>
            
        </div>
    </header>

    <!-- Contenido dinámico de cada página -->
    <main>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>

</html>
