<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestión Documental{% endblock %}</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    {% load static %}
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="{% static 'documentos/css/Base_Horas.css' %}">
</head>

<body>
    <!-- Encabezado -->
    <header class="header shadow">
        <div class="header-container container-fluid d-flex justify-content-between align-items-center">
            <a href="{% url 'inicio' %}" class="logo d-flex align-items-center">
                <img src="{% static 'documentos/images/Logo_Cenyt_Reducido.png' %}" alt="Logo Cenyt" width="40" height="40" class="me-2">
                <span>Web CEN&T</span>
            </a>
            <nav class="navbar d-flex align-items-center">
                <span class="user-info me-3">Usuario: {{ user.username }}</span>
                <a id="Cerrar" href="{% url 'logout' %}" class="nav-link btn">Cerrar Sesión</a>
            </nav>
        </div>
    </header>

    <!-- Contenido principal -->

{% block content %}
   ...
{% endblock %}




    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
